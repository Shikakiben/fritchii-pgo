name: build appimage

# Builds NX2navi's Linux build kit with the GUI window and publishes it as an AppImage, so the
# download is "take the file from Releases and run it": no source checkout, no dotnet, no pip.
#
# The NX2navi sources are fetched from upstream at run time; this repository holds only the window
# and this workflow. No game data is involved.

on:
  workflow_dispatch:
    inputs:
      nx2navi_ref:
        description: "NX2navi tag, branch or commit (empty = the newest release)"
        type: string
        default: ""
      release:
        description: "Publish the AppImage as a GitHub release"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '23 6 * * *'        # daily: a new NX2navi release is picked up within a day
  release:
    types: [published]

permissions:
  contents: write

env:
  PY_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10+20261026-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
  AIT_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  RT_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve the NX2navi tag
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.nx2navi_ref }}
        run: |
          set -euo pipefail
          ref="$WANTED"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/tangerineturtle1/NX2navi/releases/latest --jq .tag_name)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building NX2navi at $ref"

      - name: Check out NX2navi
        uses: actions/checkout@v5
        with:
          repository: tangerineturtle1/NX2navi
          ref: ${{ steps.ref.outputs.ref }}
          path: kat

      - name: Check out this repository (the window)
        uses: actions/checkout@v5
        with:
          path: gui

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 cmake ninja-build git curl ca-certificates xz-utils file \
            libicu-dev libssl-dev zlib1g-dev libffi-dev

      # tools/build_xlate.py publishes the shader translator with .NET's NativeAOT, which links with
      # the system clang. This is the only reason the build needs dotnet: the AppImage does not.
      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the shader translator
        working-directory: kat
        run: |
          set -euo pipefail
          python3 tools/build_xlate.py
          test -x build/xlate/nx2navi_xlate
          ls -la build/xlate

      - name: Fetch Python and appimagetool
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/dl/python.tar.gz" "$PY_URL"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/dl/appimagetool" "$AIT_URL"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/dl/runtime" "$RT_URL"
          chmod +x "$RUNNER_TEMP/dl/appimagetool"
          ls -la "$RUNNER_TEMP/dl"

      - name: Assemble and pack the AppImage
        env:
          CACHE: ${{ runner.temp }}/dl
        run: |
          set -euo pipefail
          # the script fetches into .cache/; point it at what was downloaded already
          mkdir -p "$GITHUB_WORKSPACE/gui/.cache"
          cp "$CACHE/python.tar.gz" "$GITHUB_WORKSPACE/gui/.cache/python.tar.gz"
          cp "$CACHE/appimagetool" "$GITHUB_WORKSPACE/gui/.cache/appimagetool.AppImage"
          cp "$CACHE/runtime" "$GITHUB_WORKSPACE/gui/.cache/runtime-x86_64"
          cd gui
          ./build-appimage.sh "$GITHUB_WORKSPACE/kat"
          ls -la dist
          cat dist/*.sha256

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: nx2navi-linux-gui
          path: |
            gui/dist/*.AppImage
            gui/dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: inputs.release || github.event_name == 'push' || github.event_name == 'release'
        working-directory: gui
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          version="$(cat "$GITHUB_WORKSPACE/kat/VERSION" 2>/dev/null || echo unknown)"
          tag="nx2navi-gui-$version"
          title="NX2navi $version — Linux AppImage with a GUI"
          notes="$(cat <<EOF
          **Download the .AppImage below, make it executable, run it.** Nothing else to install on the
          emulator side: the shader translator, Python and its packages are inside.

          Builds *The Legend of Zelda: Ocarina of Time* (Nintendo Switch 2) from your own \`.nup\` dump.
          **No game files are included.**

          - NX2navi sources: \`$REF\`
          - the window checks for \`clang\`, \`lld\` and the development headers of SDL3, Vulkan, Opus,
            libvpx, dav1d and zstd, and offers the install command for your distribution
          - \`NX2NAVI_SHADOW=0\` is set automatically on NVIDIA (the black-world workaround)

          On Fedora the packages are:
          \`\`\`
          sudo dnf install -y clang lld SDL3-devel opus-devel libvpx-devel libdav1d-devel libzstd-devel vulkan-headers vulkan-loader-devel libstdc++-static libatomic
          \`\`\`
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists: replacing its files"
            gh release upload "$tag" dist/*.AppImage dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.AppImage dist/*.sha256 \
              --title "$title" --notes "$notes" --prerelease
          fi
