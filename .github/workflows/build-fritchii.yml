name: build fritchii

# Fritchii — Frizti/Fritchii
# Its branch list is here, so it can never be paired with another project.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Fritchii branch or tag"
        type: choice
        options:
          - "default (nx2)"
          - nx2
          - oot-gather-fix
          - fritchii-v5.5
          - fritchii-v5.3
          - hotfix/v4.1
          - test/no-sky-fold
          - "other (type below)"
        default: "default (nx2)"
      linux_fix:
        description: "Linux build fixes: none, status (X11 Status macro), v5 (all three of PR #19), v57 (PRs #43 and #52)"
        type: choice
        options:
          - none
          - status
          - v5
          - v57
        default: "none"
      disable_werror:
        description: "Build with -DENABLE_WERROR=OFF (v5 raises 11 warnings; they become errors)"
        type: boolean
        default: false
      ref_custom:
        description: "Used when branch is 'other': any branch, tag or commit"
        type: string
        default: ""
      upstream:
        description: "Optional: another repository, owner/name"
        type: string
        default: ""
      label:
        description: "Name the output after the release, e.g. Fritchii-v5.7 (empty: fritchii)"
        type: string
        default: ""
      release:
        description: "Build the newest Fritchii release instead of a branch (its tag and name are used)"
        type: choice
        options:
          - "no (use the branch)"
          - latest
        default: "no (use the branch)"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      project: fritchii
      branch: ${{ inputs.branch }}
      # `status` is the old boolean path (apply_pr_fix); `v5` applies the patch in patches/.
      apply_pr_fix: ${{ inputs.linux_fix == 'status' && 'true' || 'false' }}
      patch: ${{ inputs.linux_fix == 'v5' && 'fritchii-v53-linux.diff' || inputs.linux_fix == 'v57' && 'fritchii-v57-linux.diff' || '' }}
      disable_werror: ${{ inputs.disable_werror && 'true' || 'false' }}
      ref_custom: ${{ inputs.ref_custom }}
      upstream: ${{ inputs.upstream }}
      label: ${{ inputs.label }}
      release: ${{ inputs.release == 'latest' && 'latest' || '' }}
