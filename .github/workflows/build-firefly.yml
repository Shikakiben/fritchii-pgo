name: build firefly

# Firefly — Kradnah/Firefly
# Its branch list is here, so it can never be paired with another project.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Firefly branch"
        type: choice
        options:
          - "default (main)"
          - main
          - "other (type below)"
        default: "default (main)"
      ref_custom:
        description: "Used when branch is 'other': any branch, tag or commit"
        type: string
        default: ""
      upstream:
        description: "Optional: another repository, owner/name"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      project: firefly
      branch: ${{ inputs.branch }}
      ref_custom: ${{ inputs.ref_custom }}
      upstream: ${{ inputs.upstream }}
