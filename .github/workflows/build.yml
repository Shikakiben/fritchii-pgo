name: build (reusable)

# Reusable build. Do not run this one directly: it has no dispatch trigger.
# Use build-firefly.yml, build-vendichii.yml or build-fritchii.yml, whose branch
# lists match the project they build.

on:
  workflow_call:
    inputs:
      project:
        description: "firefly, vendichii or fritchii"
        type: string
        required: true
      branch:
        description: "Branch chosen in the caller, or (project default) / other (type it below)"
        type: string
        default: "(project default)"
      ref_custom:
        description: "Branch, tag or commit used when branch is 'other'"
        type: string
        default: ""
      upstream:
        description: "Override repository, owner/name"
        type: string
        default: ""

permissions:
  contents: read

env:
  # clang major that can read eglantine.profdata (profile format version 14).
  # LLVM 21/22 cannot: they read versions 12/13.
  PGO_LLVM_VERSION: "23"
  # Keep the object cache inside the workspace so it can be saved between runs.
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: ${{ inputs.project }}-linux-x86_64-pgo
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Resolve the target repository
        id: target
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          BRANCH: ${{ inputs.branch }}
          REF_CUSTOM: ${{ inputs.ref_custom }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          set -euo pipefail
          case "$PROJECT" in
            firefly)   repo="Kradnah/Firefly";      default_ref="main" ;;
            vendichii) repo="VendavalSC/Vendichii"; default_ref="main" ;;
            fritchii)  repo="Frizti/Fritchii";      default_ref="nx2"  ;;
            *) echo "unknown project: $PROJECT"; exit 1 ;;
          esac
          if [ -n "$UPSTREAM" ]; then
            repo="$UPSTREAM"
            default_ref="main"
          fi
          case "$BRANCH" in
            default*|"(project default)")      ref="$default_ref" ;;
            other*|"other (type it below)")    ref="$REF_CUSTOM" ;;
            *)                                 ref="$BRANCH" ;;
          esac
          if [ -z "$ref" ]; then
            echo "no branch: pick one, or fill 'ref_custom' with branch/tag/commit"; exit 1
          fi
          # Accept a pasted GitHub URL such as
          # https://github.com/Frizti/Fritchii/tree/hotfix/v4.1
          case "$ref" in
            *github.com/*/tree/*) ref="${ref#*/tree/}" ;;
            *github.com/*/commit/*) ref="${ref#*/commit/}" ;;
          esac
          name="$(basename "$repo" | tr '[:upper:]' '[:lower:]')"
          # Timestamp of the build in Paris time, so two builds of the same commit are
          # told apart: 20261108-1755
          stamp="$(TZ=Europe/Paris date +%Y%m%d-%H%M)"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "building $repo @ $ref as $name ($stamp Paris)"

      # Fail here, in seconds, rather than 30 minutes later in the checkout step.
      - name: Check the branch exists upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/$REF" > /dev/null 2>&1; then
            echo "branch $REF exists in $REPO"
          elif gh api "repos/$REPO/git/ref/tags/$REF" > /dev/null 2>&1; then
            echo "tag $REF exists in $REPO"
          elif gh api "repos/$REPO/commits/$REF" > /dev/null 2>&1; then
            echo "commit $REF exists in $REPO"
          else
            echo "::error::$REF does not exist in $REPO"
            echo "Branches available in $REPO:"
            gh api "repos/$REPO/branches?per_page=100" --jq '.[].name' || true
            exit 1
          fi

      - name: Check out upstream source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: src-tree

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-
            ccache-${{ steps.target.outputs.repo }}-
            ccache-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev \
            libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          # The AppImage step asks linuxdeploy for the Wayland platform plugins.
          test -f /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqwayland-egl.so \
            || { echo "missing Qt Wayland plugin"; exit 1; }

      - name: Install clang for PGO
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      - name: Check the PGO profile is present
        working-directory: src-tree
        run: |
          set -euo pipefail
          ls -la eglantine.profdata
          test -s eglantine.profdata

      - name: Configure
        working-directory: src-tree
        run: |
          set -euo pipefail
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER="clang-$PGO_LLVM_VERSION" \
            -DCMAKE_CXX_COMPILER="clang++-$PGO_LLVM_VERSION" \
            -DCMAKE_EXE_LINKER_FLAGS="-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld" \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build
        working-directory: src-tree
        run: |
          set -euo pipefail
          ccache --zero-stats || true
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats || true

      # Keep the compiled programs even if the AppImage packaging fails afterwards:
      # a packaging bug must not throw away a 30-minute build.
      - name: Upload the raw binaries as a fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.name }}-linux-x86_64-pgo-binaries-${{ steps.target.outputs.stamp }}
          path: src-tree/build/release/bin/
          if-no-files-found: warn
          retention-days: 7

      - name: Package the AppImage
        working-directory: src-tree
        run: |
          set -euo pipefail
          test -x build/release/bin/eden-cli

          # The GUI binary is named `firefly` in Firefly and `lichii` in the
          # Vendichii/Fritchii forks; detect it instead of hardcoding a name.
          bin=""
          for candidate in build/release/bin/firefly build/release/bin/lichii \
                           build/release/bin/vendichii build/release/bin/fritchii; do
            if [ -x "$candidate" ]; then bin="$candidate"; break; fi
          done
          if [ -z "$bin" ]; then
            bin="$(find build/release/bin -maxdepth 1 -type f -perm /111 \
                     ! -name 'eden-cli' ! -name '*.txt' | head -n 1)"
          fi
          [ -n "$bin" ] && [ -x "$bin" ] || { echo "no GUI binary found"; ls -la build/release/bin; exit 1; }
          echo "GUI binary: $bin"

          desktop="$(find dist -maxdepth 1 -name '*.desktop' | head -n 1)"
          [ -n "$desktop" ] || { echo "no .desktop file in dist/"; exit 1; }

          icon=""
          for candidate in dist/lichii.png dist/firefly.png dist/vendichii.png dist/fritchii.png; do
            [ -f "$candidate" ] && { icon="$candidate"; break; }
          done
          [ -n "$icon" ] || icon="$(find dist -maxdepth 1 -name '*.png' | head -n 1)"
          [ -n "$icon" ] || { echo "no icon found"; exit 1; }
          echo "desktop: $desktop   icon: $icon"

          # linuxdeploy looks the icon up by the name in the desktop file's Icon=
          # entry, so the deployed file must carry that name, not the source name.
          icon_name="$(sed -n 's/^Icon=//p' "$desktop" | head -n 1)"
          [ -n "$icon_name" ] || icon_name="$(basename "${icon%.*}")"
          icon_file="$RUNNER_TEMP/$icon_name.png"
          cp "$icon" "$icon_file"
          echo "icon deployed as: $icon_file"

          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          # No install-qt-action here, so point the Qt plugin at the system qmake.
          export QMAKE="$(command -v qmake6 || command -v qmake || echo /usr/lib/qt6/bin/qmake)"
          qt_platforms=/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms
          if [ -f "$qt_platforms/libqwayland-egl.so" ] && [ -f "$qt_platforms/libqwayland-generic.so" ]; then
            export EXTRA_QT_MODULES=waylandcompositor
            export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          else
            # Never fail the packaging over an optional platform plugin: ship X11-only instead.
            echo "::warning::Qt Wayland plugins missing; packaging without them"
          fi

          name="${{ steps.target.outputs.name }}"
          stamp="${{ steps.target.outputs.stamp }}"
          export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-${stamp}"
          export LDAI_OUTPUT="${name}-linux-x86_64-pgo-${stamp}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"

          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable "$bin" \
            --executable build/release/bin/eden-cli \
            --desktop-file "$desktop" \
            --icon-file "$icon_file" \
            --plugin qt \
            --output appimage

          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"
          sha256sum "$LDAI_OUTPUT" > "$LDAI_OUTPUT.sha256"
          cat "$LDAI_OUTPUT.sha256"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.name }}-linux-x86_64-pgo-${{ steps.target.outputs.stamp }}
          path: |
            src-tree/*.AppImage
            src-tree/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
