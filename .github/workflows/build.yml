name: build fritchii

# Builds Fritchii's Linux x86-64 PGO AppImage from upstream's own source, the way upstream's own
# release-binaries.yml builds it: ubuntu-24.04, Qt 6.8.3 from install-qt-action, clang plus the
# repo's eglantine.profdata, and linuxdeploy for the AppImage. That base is what makes the result
# portable: glibc 2.39, so it starts on Ubuntu 24.04, Fedora 40+, Debian 13 and Arch.
#
# Fritchii is the only thing built here.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build the newest Fritchii release (its tag is built, its name labels the output)"
        type: choice
        options:
          - latest
          - "no (use the ref below)"
        default: latest
      ref:
        description: "Branch, tag or commit used when release is 'no'. A pasted GitHub URL is accepted"
        type: string
        default: linux-port
      disable_werror:
        description: "Configure with -DENABLE_WERROR=OFF (upstream's PR #43 is still open)"
        type: boolean
        default: true
      label:
        description: "Override the output name (default: the release's name, else fritchii)"
        type: string
        default: ""

permissions:
  contents: write   # publishing the AppImage as a release

env:
  # clang major that can read eglantine.profdata (profile format version 14).
  # LLVM 21/22 cannot: they read versions 12/13.
  PGO_LLVM_VERSION: "23"
  # Keep the object cache inside the workspace so it can be saved between runs.
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: linux-x86_64-pgo
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Resolve the target repository
        id: target
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          REF_INPUT: ${{ inputs.ref }}
          LABEL: ${{ inputs.label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="Frizti/Fritchii"
          ref="$REF_INPUT"
          relname=""
          # A release, when asked for: its tag is what gets built, and its name labels the
          # output. Fritchii publishes every release as a pre-release, so /releases/latest
          # (which skips pre-releases) returns 404: take the newest entry of the list.
          if [ "$RELEASE" = "latest" ]; then
            rel="$(gh api "repos/$repo/releases?per_page=1" --jq '.[0] | "\(.tag_name)\t\(.name)"')"
            ref="${rel%%$'\t'*}"
            relname="${rel#*$'\t'}"
            if [ -z "$ref" ]; then
              echo "::error::no release found in $repo"; exit 1
            fi
            echo "release: $relname ($ref)"
            # Publishing is keyed on this: a branch build never becomes a release.
            echo "release_name=$relname" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$ref" ]; then
            echo "::error::no ref: pick 'latest', or give a branch, tag or commit"; exit 1
          fi
          # Accept a pasted GitHub URL such as
          # https://github.com/Frizti/Fritchii/tree/hotfix/v4.1
          case "$ref" in
            *github.com/*/tree/*) ref="${ref#*/tree/}" ;;
            *github.com/*/commit/*) ref="${ref#*/commit/}" ;;
          esac
          name="$(basename "$repo" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$LABEL" ] && [ -n "$relname" ]; then
            LABEL="$(printf '%s' "$relname" | tr ' ' '-')"
          fi
          if [ -n "$LABEL" ]; then
            name="$LABEL"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "building $repo @ $ref as $name"

      # Fail here, in seconds, rather than 30 minutes later in the checkout step.
      - name: Check the branch exists upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/$REF" > /dev/null 2>&1; then
            echo "branch $REF exists in $REPO"
          elif gh api "repos/$REPO/git/ref/tags/$REF" > /dev/null 2>&1; then
            echo "tag $REF exists in $REPO"
          elif gh api "repos/$REPO/commits/$REF" > /dev/null 2>&1; then
            echo "commit $REF exists in $REPO"
          else
            echo "::error::$REF does not exist in $REPO"
            echo "Branches available in $REPO:"
            gh api "repos/$REPO/branches?per_page=100" --jq '.[].name' || true
            exit 1
          fi

      - name: Check out upstream source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: src-tree

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-
            ccache-${{ steps.target.outputs.repo }}-
            ccache-

      # Upstream's own list (release-binaries.yml), which is what its ubuntu-24.04 job installs.
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          # A runner lost DNS for azure.archive.ubuntu.com and apt gave up here after an hour and
          # forty minutes of retries ("Temporary failure resolving"), which threw the whole build
          # away before it compiled anything. apt's own retries do not cover a resolver outage, so
          # the whole update+install runs again, five times, with a growing pause.
          attempt=1
          while true; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
                 libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
                 mesa-common-dev nasm ninja-build \
                 libavfilter-dev libavcodec-dev libswscale-dev pkg-config zlib1g-dev \
                 libva-dev libvdpau-dev spirv-tools spirv-headers libusb-1.0-0-dev \
                 libboost-dev libboost-fiber-dev libboost-context-dev libopus-dev libasound2-dev \
                 ccache libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::apt failed five times"; exit 1
            fi
            echo "apt failed (attempt $attempt); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      # Upstream's CI takes Qt 6.8.3 from install-qt-action, not the runner's Qt 6.4.2: the
      # source uses APIs newer than noble's, and the Qt plugin of linuxdeploy bundles this one.
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install clang for PGO
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # v6.0 dropped eglantine.profdata from the tree, so upstream's own PGO job would stop at its
      # "test -s eglantine.profdata". The last tag that carries it is fritchii-v5.8.4; a profile
      # from older code still guides the compiler, and the -Wno-profile-instr-* flags below
      # silence the functions it no longer matches.
      - name: The PGO profile
        working-directory: src-tree
        run: |
          set -euo pipefail
          if [ ! -s eglantine.profdata ]; then
            echo "no eglantine.profdata in this source: taking fritchii-v5.8.4's"
            curl -fsSL -o eglantine.profdata \
              https://raw.githubusercontent.com/Frizti/Fritchii/fritchii-v5.8.4/eglantine.profdata
          fi
          ls -la eglantine.profdata
          test -s eglantine.profdata

      # v6.1's fritchii_e_split.cpp dynamic_casts the engine in KindOf() (line 973), but
      # src/CMakeLists.txt adds -fno-rtti to every non-MSVC C++ file. Upstream builds Windows with
      # MSVC, where that option is never added, so its CI could not see it. add_compile_options
      # comes after CMAKE_CXX_FLAGS on the command line, so the last -f would win: the option has
      # to go from the file itself. Nothing else in the tree relies on RTTI being off.
      - name: Let RTTI on for the dynamic_cast
        working-directory: src-tree
        run: |
          set -euo pipefail
          grep -q 'COMPILE_LANGUAGE:CXX>:-fno-rtti' src/CMakeLists.txt
          sed -i 's/\$<\$<COMPILE_LANGUAGE:CXX>:-fno-rtti>/\$<$<COMPILE_LANGUAGE:CXX>:-frtti>/' src/CMakeLists.txt
          grep -n 'COMPILE_LANGUAGE:CXX>:-f' src/CMakeLists.txt

      - name: Configure
        working-directory: src-tree
        env:
          WERROR: ${{ inputs.disable_werror }}
        run: |
          set -euo pipefail
          # -Wno-c++11-narrowing: v6.1 writes u64{regs.pitch_out} and the like, where the member is
          # s32. GCC takes it as an extension, clang makes it an error (maxwell_dma.cpp:216 was the
          # first). The values are non-negative, so the conversion is what the code means.
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date -Wno-c++11-narrowing"
          # Upstream builds with -Werror; a new warning then stops the build. PR #43 (a range-for
          # copying a QString in fritchii_ui.cpp) is still open, so this is on by default.
          werror_flag=()
          if [ "$WERROR" = 'true' ]; then
            werror_flag=(-DENABLE_WERROR=OFF)
            echo "ENABLE_WERROR=OFF"
          fi
          cmake -S . -B build/release -G Ninja \
            "${werror_flag[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER="clang-$PGO_LLVM_VERSION" \
            -DCMAKE_CXX_COMPILER="clang++-$PGO_LLVM_VERSION" \
            -DCMAKE_EXE_LINKER_FLAGS="-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld" \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      # v6.1 dropped the yuzu-cmd target (src/yuzu_cmd is gone): the one program is yuzu, which
      # writes bin/lichii on Linux (src/yuzu/CMakeLists.txt: OUTPUT_NAME).
      - name: Build
        working-directory: src-tree
        run: |
          set -euo pipefail
          ccache --zero-stats || true
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats || true

      # Upstream's packaging step, with the icon it now ships: v6.1 renamed dist/lichii.png to
      # dist/fritchii.png, and its own workflow still names the old one.
      - name: Package the AppImage
        working-directory: src-tree
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # linuxdeploy names the deployed icon after the file, and the desktop file asks for
          # Icon=io.github.zortos293.lichii: the file has to carry that name, or the packaging
          # stops on "Could not find suitable icon for Icon entry".
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          if [ -f dist/fritchii.png ]; then cp dist/fritchii.png "$icon"; else cp dist/lichii.png "$icon"; fi
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="${{ steps.target.outputs.name }}"
          export LDAI_OUTPUT="${{ steps.target.outputs.name }}-linux-x86_64-pgo.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          rm -rf squashfs-root
          sha256sum "$LDAI_OUTPUT" > "$LDAI_OUTPUT.sha256"
          cat "$LDAI_OUTPUT.sha256"

      # A release, not only the 30-day artifact: anyone looking at the repository finds the
      # AppImage with its checksum. Same tag as upstream, so Fritchii's own version is the key
      # and a rebuild of the same release replaces its asset instead of piling up.
      - name: Publish the AppImage as a release
        if: steps.target.outputs.release_name != ''
        working-directory: src-tree
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.ref }}
          RELNAME: ${{ steps.target.outputs.release_name }}
        run: |
          set -euo pipefail
          asset="$(basename ./*.AppImage)"
          notes=$(cat <<EOF
          **$RELNAME** for Linux, x86-64, built from the upstream source at \`$TAG\`.

          Unofficial build: Fritchii itself ships Windows only. No game files are included — it
          builds the game from your own dump, as the Windows build does.

          \`\`\`sh
          chmod +x $asset
          ./$asset
          \`\`\`

          Built the way upstream's own release workflow builds it: ubuntu-24.04, Qt 6.8.3, clang
          with the repo's PGO profile, linuxdeploy. Needs glibc 2.39 or newer (Ubuntu 24.04,
          Fedora 40+, Debian 13, Arch).

          Built from commit \`${GITHUB_SHA::7}\` by
          [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          Check the \`.sha256\` next to the file.
          EOF
          )
          # --repo on every call: this step runs in src-tree, a checkout of the upstream
          # repository, so gh would otherwise infer Frizti/Fritchii from the git remote and
          # attach the asset to *its* release (HTTP 403, and a write we must never attempt),
          # which is exactly what the first attempt did.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.AppImage ./*.AppImage.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "asset replaced on the existing release $TAG"
          else
            gh release create "$TAG" ./*.AppImage ./*.AppImage.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELNAME — Linux x86-64 AppImage" \
              --target "$GITHUB_SHA" \
              --notes "$notes"
            echo "release $TAG created"
          fi

      # always(): a failed publish below must not also throw away the AppImage. On 11 Nov
      # the release step failed and this one was skipped, so a finished AppImage existed only
      # on the runner that had just been destroyed.
      - name: Upload the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.name }}-linux-x86_64-pgo
          path: |
            src-tree/*.AppImage
            src-tree/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
