name: build fritchii

# Builds Fritchii's Linux x86-64 PGO AppImage from upstream's own source, and publishes it as a
# release. Fritchii ships Windows only, so this is the only place its Linux build can be found.
#
# Fritchii is the only thing built here.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build the newest Fritchii release (its tag is built, its name labels the output)"
        type: choice
        options:
          - latest
          - "no (use the ref below)"
        default: latest
      ref:
        description: "Branch, tag or commit used when release is 'no'. A pasted GitHub URL is accepted"
        type: string
        default: nx2
      linux_fix:
        description: "Linux fixes for the checked-out source: none, or pr43-52 (PRs #43 and #52)"
        type: choice
        options:
          - pr43-52
          - none
        default: pr43-52
      disable_werror:
        description: "Configure with -DENABLE_WERROR=OFF"
        type: boolean
        default: false
      label:
        description: "Override the output name (default: the release's name, else fritchii)"
        type: string
        default: ""

permissions:
  contents: write   # publishing the AppImage as a release

env:
  # clang major that can read eglantine.profdata (profile format version 14).
  # LLVM 21/22 cannot: they read versions 12/13.
  PGO_LLVM_VERSION: "23"
  # Keep the object cache inside the workspace so it can be saved between runs.
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: linux-x86_64-pgo
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Resolve the target repository
        id: target
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          REF_INPUT: ${{ inputs.ref }}
          FIX: ${{ inputs.linux_fix }}
          LABEL: ${{ inputs.label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="Frizti/Fritchii"
          ref="$REF_INPUT"
          relname=""
          # A release, when asked for: its tag is what gets built, and its name labels the
          # output. Fritchii publishes every release as a pre-release, so /releases/latest
          # (which skips pre-releases) returns 404: take the newest entry of the list.
          if [ "$RELEASE" = "latest" ]; then
            rel="$(gh api "repos/$repo/releases?per_page=1" --jq '.[0] | "\(.tag_name)\t\(.name)"')"
            ref="${rel%%$'\t'*}"
            relname="${rel#*$'\t'}"
            if [ -z "$ref" ]; then
              echo "::error::no release found in $repo"; exit 1
            fi
            echo "release: $relname ($ref)"
            # Publishing is keyed on this: a branch build never becomes a release.
            echo "release_name=$relname" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$ref" ]; then
            echo "::error::no ref: pick 'latest', or give a branch, tag or commit"; exit 1
          fi
          # Accept a pasted GitHub URL such as
          # https://github.com/Frizti/Fritchii/tree/hotfix/v4.1
          case "$ref" in
            *github.com/*/tree/*) ref="${ref#*/tree/}" ;;
            *github.com/*/commit/*) ref="${ref#*/commit/}" ;;
          esac
          name="$(basename "$repo" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$LABEL" ] && [ -n "$relname" ]; then
            LABEL="$(printf '%s' "$relname" | tr ' ' '-')"
          fi
          if [ -n "$LABEL" ]; then
            name="$LABEL"
          fi
          # The Linux fix this source needs. pr43-52 carries two upstream pull requests that
          # are still open; set linux_fix = none once upstream merges them, or the patch stops
          # applying and the build says so in seconds.
          patch=""
          case "$FIX" in
            pr43-52) patch="fritchii-linux-pr43-pr52.diff" ;;
            *)       patch="" ;;
          esac
          # The build's time in Paris, kept for the AppImage's own version string and the log
          # line; the artifact and file names no longer carry it.
          stamp="$(TZ=Europe/Paris date +%Y%m%d-%H%M)"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "building $repo @ $ref as $name ($stamp Paris, linux_fix: ${patch:-none})"

      # Fail here, in seconds, rather than 30 minutes later in the checkout step.
      - name: Check the branch exists upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/$REF" > /dev/null 2>&1; then
            echo "branch $REF exists in $REPO"
          elif gh api "repos/$REPO/git/ref/tags/$REF" > /dev/null 2>&1; then
            echo "tag $REF exists in $REPO"
          elif gh api "repos/$REPO/commits/$REF" > /dev/null 2>&1; then
            echo "commit $REF exists in $REPO"
          else
            echo "::error::$REF does not exist in $REPO"
            echo "Branches available in $REPO:"
            gh api "repos/$REPO/branches?per_page=100" --jq '.[].name' || true
            exit 1
          fi

      - name: Check out upstream source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.ref }}
          path: src-tree

      - name: Check out this repository (holds patches/)
        if: steps.target.outputs.patch != ''
        uses: actions/checkout@v5
        with:
          path: builder

      # The patch this source needs (patches/*.diff), applied on top of the checkout:
      # fritchii-linux-pr43-pr52.diff carries PRs #43 and #52, still open upstream.
      - name: Apply a local patch (optional)
        if: steps.target.outputs.patch != ''
        working-directory: src-tree
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/builder/patches/${{ steps.target.outputs.patch }}"
          test -f "$patch_file" || { echo "::error::no such patch: $patch_file"; ls -la "$GITHUB_WORKSPACE/builder/patches" || true; exit 1; }
          echo "applying ${{ steps.target.outputs.patch }}"
          if git apply --check "$patch_file" 2>/dev/null; then
            git apply "$patch_file"
            echo "patch applied"
          elif git apply --check -3 "$patch_file" 2>/dev/null; then
            git apply -3 "$patch_file"
            echo "patch applied (3-way)"
          else
            echo "::error::${{ steps.target.outputs.patch }} does not apply to this source; upstream moved, refresh or drop the patch"
            git apply --check -v "$patch_file" || true
            exit 1
          fi
          git diff --stat | tail -12

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.ref }}-
            ccache-${{ steps.target.outputs.repo }}-
            ccache-

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          # A runner lost DNS for azure.archive.ubuntu.com and apt gave up here after an hour and
          # forty minutes of retries ("Temporary failure resolving"), which threw the whole build
          # away before it compiled anything. apt's own retries do not cover a resolver outage, so
          # the whole update+install runs again, five times, with a growing pause.
          attempt=1
          while true; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
                 libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
                 mesa-common-dev nasm ninja-build qt6-base-private-dev \
                 qt6-charts-dev qt6-tools-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev \
                 libqt6svg6 \
                 libavfilter-dev libavcodec-dev \
                 libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
                 spirv-tools spirv-headers libusb-1.0-0-dev \
                 libboost-dev libboost-fiber-dev libboost-context-dev \
                 libopus-dev libasound2-dev ccache \
                 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
                 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::apt could not install the dependencies after 5 attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "apt failed, attempt $attempt in 20s"
            sleep 20
          done
          # The AppImage step asks linuxdeploy for the Wayland platform plugins.
          test -f /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqwayland-egl.so \
            || { echo "missing Qt Wayland plugin"; exit 1; }

      - name: Install clang for PGO
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          # Same resolver outages as the step above: retry the pair instead of losing the run.
          attempt=1
          while true; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::apt could not install clang-$PGO_LLVM_VERSION after 5 attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "apt failed, attempt $attempt in 20s"
            sleep 20
          done
          "clang-$PGO_LLVM_VERSION" --version

      - name: Check the PGO profile is present
        working-directory: src-tree
        run: |
          set -euo pipefail
          ls -la eglantine.profdata
          test -s eglantine.profdata

      - name: Configure
        working-directory: src-tree
        env:
          WERROR: ${{ inputs.disable_werror }}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          # Upstream builds with -Werror; a new warning then stops the build. disable_werror
          # turns that off for a branch upstream does not build on Linux.
          werror_flag=()
          if [ "$WERROR" = 'true' ]; then
            werror_flag=(-DENABLE_WERROR=OFF)
            echo "ENABLE_WERROR=OFF"
          fi
          cmake -S . -B build/release -G Ninja \
            "${werror_flag[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER="clang-$PGO_LLVM_VERSION" \
            -DCMAKE_CXX_COMPILER="clang++-$PGO_LLVM_VERSION" \
            -DCMAKE_EXE_LINKER_FLAGS="-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld" \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build
        working-directory: src-tree
        run: |
          set -euo pipefail
          ccache --zero-stats || true
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats || true

      # Keep the compiled programs even if the AppImage packaging fails afterwards:
      # a packaging bug must not throw away a 30-minute build.
      # Never fatal: GitHub's artifact service answered with HTML instead of JSON for five
      # attempts on 11 Nov and this step failed the run, skipping the packaging of a build
      # that had compiled every one of its 1944 targets.
      - name: Upload the raw binaries as a fallback
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.name }}-linux-x86_64-pgo-binaries
          path: src-tree/build/release/bin/
          if-no-files-found: warn
          retention-days: 7

      - name: Package the AppImage
        working-directory: src-tree
        run: |
          set -euo pipefail
          test -x build/release/bin/eden-cli

          # The GUI binary is `lichii` in Fritchii; keep the detection generic so an
          # `upstream` override still packages the right program.
          bin=""
          for candidate in build/release/bin/lichii build/release/bin/eglantine \
                           build/release/bin/fritchii; do
            if [ -x "$candidate" ]; then bin="$candidate"; break; fi
          done
          if [ -z "$bin" ]; then
            bin="$(find build/release/bin -maxdepth 1 -type f -perm /111 \
                     ! -name 'eden-cli' ! -name '*.txt' | head -n 1)"
          fi
          [ -n "$bin" ] && [ -x "$bin" ] || { echo "no GUI binary found"; ls -la build/release/bin; exit 1; }
          echo "GUI binary: $bin"

          desktop="$(find dist -maxdepth 1 -name '*.desktop' | head -n 1)"
          [ -n "$desktop" ] || { echo "no .desktop file in dist/"; exit 1; }

          icon=""
          for candidate in dist/lichii.png dist/Eglantine.png dist/fritchii.png; do
            [ -f "$candidate" ] && { icon="$candidate"; break; }
          done
          [ -n "$icon" ] || icon="$(find dist -maxdepth 1 -name '*.png' | head -n 1)"
          [ -n "$icon" ] || { echo "no icon found"; exit 1; }
          echo "desktop: $desktop   icon: $icon"

          # linuxdeploy looks the icon up by the name in the desktop file's Icon=
          # entry, so the deployed file must carry that name, not the source name.
          icon_name="$(sed -n 's/^Icon=//p' "$desktop" | head -n 1)"
          [ -n "$icon_name" ] || icon_name="$(basename "${icon%.*}")"
          icon_file="$RUNNER_TEMP/$icon_name.png"
          cp "$icon" "$icon_file"
          echo "icon deployed as: $icon_file"

          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          # No install-qt-action here, so point the Qt plugin at the system qmake.
          export QMAKE="$(command -v qmake6 || command -v qmake || echo /usr/lib/qt6/bin/qmake)"
          qt_platforms=/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms
          if [ -f "$qt_platforms/libqwayland-egl.so" ] && [ -f "$qt_platforms/libqwayland-generic.so" ]; then
            export EXTRA_QT_MODULES=waylandcompositor
            export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          else
            # Never fail the packaging over an optional platform plugin: ship X11-only instead.
            echo "::warning::Qt Wayland plugins missing; packaging without them"
          fi

          name="${{ steps.target.outputs.name }}"
          stamp="${{ steps.target.outputs.stamp }}"
          export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-${stamp}"
          export LDAI_OUTPUT="${name}-linux-x86_64-pgo.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"

          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable "$bin" \
            --executable build/release/bin/eden-cli \
            --desktop-file "$desktop" \
            --icon-file "$icon_file" \
            --plugin qt \
            --output appimage

          test -s "$LDAI_OUTPUT"
          # Fritchii draws every icon through QImageReader("svg") (fritchii_ui.cpp
          # RenderSvg). That reader is a plugin loaded at run time, never a linked
          # dependency, so it only ships if libqt6svg6 is installed when linuxdeploy
          # scans the Qt plugin directory. Without it every toolbar, Settings and
          # in-game dock icon is an empty pixmap: the buttons are there and clickable,
          # but invisible except for their hover shadow (what 5.8.4 shipped).
          rm -rf squashfs-root
          ./"$LDAI_OUTPUT" --appimage-extract 'usr/plugins/imageformats/libqsvg.so' \
            > /dev/null 2>&1 || true
          if [ ! -f squashfs-root/usr/plugins/imageformats/libqsvg.so ]; then
            echo "::error::$LDAI_OUTPUT has no Qt SVG image plugin: every icon would be blank"
            exit 1
          fi
          rm -rf squashfs-root
          ls -la "$LDAI_OUTPUT"
          sha256sum "$LDAI_OUTPUT" > "$LDAI_OUTPUT.sha256"
          cat "$LDAI_OUTPUT.sha256"

      # A release, not only the 30-day artifact: anyone looking at the repository finds the
      # AppImage with its checksum. Same tag as upstream, so Fritchii's own version is the key
      # and a rebuild of the same release replaces its asset instead of piling up.
      - name: Publish the AppImage as a release
        if: steps.target.outputs.release_name != ''
        working-directory: src-tree
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.ref }}
          RELNAME: ${{ steps.target.outputs.release_name }}
          PATCH: ${{ steps.target.outputs.patch }}
        run: |
          set -euo pipefail
          asset="$(basename ./*.AppImage)"
          if [ -n "$PATCH" ]; then
            fix_line="Applies the Linux pull requests still open upstream (#43 and #52); the README says what they fix."
          else
            fix_line="Built from the upstream source untouched."
          fi
          notes=$(cat <<EOF
          **$RELNAME** for Linux, x86-64, built from the upstream source at \`$TAG\`.

          Unofficial build: Fritchii itself ships Windows only. No game files are included — it
          builds the game from your own dump, as the Windows build does.

          \`\`\`sh
          chmod +x $asset
          ./$asset
          \`\`\`

          $fix_line
          Built from commit \`${GITHUB_SHA::7}\` by
          [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          Check the \`.sha256\` next to the file.
          EOF
          )
          # --repo on every call: this step runs in src-tree, a checkout of the upstream
          # repository, so gh would otherwise infer Frizti/Fritchii from the git remote and
          # attach the asset to *its* release (HTTP 403, and a write we must never attempt),
          # which is exactly what the first attempt did.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.AppImage ./*.AppImage.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "asset replaced on the existing release $TAG"
          else
            gh release create "$TAG" ./*.AppImage ./*.AppImage.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELNAME — Linux x86-64 AppImage" \
              --target "$GITHUB_SHA" \
              --notes "$notes"
            echo "release $TAG created"
          fi

      # always(): a failed publish below must not also throw away the AppImage. On 11 Nov
      # the release step failed and this one was skipped, so a finished AppImage existed only
      # on the runner that had just been destroyed.
      - name: Upload the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.name }}-linux-x86_64-pgo
          path: |
            src-tree/*.AppImage
            src-tree/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
